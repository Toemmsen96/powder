# Copy to launcher.toml (next to config.toml) and adjust. Every setting is optional.

# The launcher's Server row (Just this PC / Host for others / Join) overrides these two once used.
server_mode = "local"            # "local": the launcher starts the Powder server here; "remote": only connect to it
server_address = "127.0.0.1"     # the address every Ubisoft hostname must resolve to (this PC, or a LAN/VPN IP)
server_https_port = 443
# server_config = "config.toml"  # Powder server config for local mode (default: config.toml next to this file)

# Paths are found automatically: Steep from Steam (any library) and from Ubisoft Connect (any folder), as
# recorded by Steam and Ubisoft Connect. Set them only if that fails. steep_exe replaces the search with
# that one copy (Steam or Ubisoft Connect version, told apart automatically).
# steam_exe = 'C:\Program Files (x86)\Steam\steam.exe'
# steep_exe = 'D:\Games\Steep\Steep.exe'
# connect_exe = 'C:\Program Files (x86)\Ubisoft\Ubisoft Game Launcher\UbisoftConnect.exe'

remove_hosts_on_exit = false     # take the hosts entries the launcher added out again when it closes
remove_ca_on_exit = false        # same for the server's CA it added to Windows' trusted roots (asks first)

# Client mods: DLLs a server offers to load into the game (see README, "Client mods"). They run on this PC
# with your rights, so they are off by default and only the mods named here are used. Each is pinned to
# its file hashes per server on first use; if the host changes it, Play asks before using the new version.
[client_mods]
enabled = false
allow = []                       # e.g. ["fov", "hud"]: exact mod names, no wildcard
