textures.STP_MF_Costume_016_Helmet_ALL.diffuse = "assets/textures/STP_MF_Costume_016_Helmet_ALL_diffuse.png"
textures.STP_MF_Costume_016_Helmet_ALL.normal = "assets/textures/STP_MF_Costume_016_Helmet_ALL_normal.png"
